name: Android checks
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew :core:test :mobile:lintDebug :wear:lintDebug :mobile:assembleDebug :wear:assembleDebug --console plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-checks-and-debug-apks
          path: |
            core/build/reports/tests/
            mobile/build/reports/
            wear/build/reports/
            mobile/build/outputs/apk/debug/*.apk
            wear/build/outputs/apk/debug/*.apk
