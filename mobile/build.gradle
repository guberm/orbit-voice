plugins { id 'com.android.application' }
apply from: rootProject.file('gradle/android-app.gradle')
android {
    namespace 'dev.orbitvoice.mobile'
    ndkVersion '28.2.13676358'
    defaultConfig {
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake { cppFlags '-std=c++17'; arguments '-DCMAKE_BUILD_TYPE=Release' } }
    }
    externalNativeBuild { cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.22.1' } }
    androidResources { noCompress += ['bin'] }
}
apply from: rootProject.file('gradle/speech-models.gradle')
dependencies {
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    implementation 'androidx.activity:activity:1.10.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    androidTestImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    androidTestImplementation 'com.squareup.okhttp3:okhttp-tls:4.12.0'
}
android.defaultConfig.testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
